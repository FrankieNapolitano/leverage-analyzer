name: Refresh Time Machine data
on:
  schedule:
    - cron: "17 11 * * 1-5"   # weekdays ~6am Central, after FRED's overnight updates
  workflow_dispatch: {}        # lets you hit "Run workflow" by hand
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download fresh data and rebuild
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python timemachine/update_data.py
      - name: Snapshot the AI-chain company numbers
        run: python snapshot_companies.py || echo "snapshot failed; continuing"
      - name: Save the new data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add timemachine/data research
          git diff --cached --quiet && echo "No changes" || (git commit -m "Daily data refresh $(date -u +%F)" && git push)
